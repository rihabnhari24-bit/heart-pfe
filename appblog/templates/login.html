<h3>Login</h3>

{% if error %}
<p style="color: red;">{{ error }}</p>
{% endif %}

<form method="post">
{% csrf_token %}

Username: <input name="username"><br>
Password: <input type="password" name="password"><br>

<button type="submit">Login</button>
</form>

<br>
<a href="{% url 'register' %}">
    <button type="button">Créer un compte</button>
</a>
