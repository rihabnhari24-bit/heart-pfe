{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart App</title>
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <div class="sidebar-logo">
            <img src="{% static 'img/img4.png' %}" alt="Logo">
        </div>
        <h4>Menu principal</h4>
        <nav>
            <a href="{% url 'welcome' %}">Accueil</a>
            <a href="{% url 'account' %}">Compte / mot de passe</a>
            <a href="{% url 'prediction' %}">Prédiction</a>
            <a href="{% url 'history' %}">Historique</a>
            <a href="{% url 'charts' %}">Graphes</a>
            <a href="{% url 'logout' %}">Déconnexion</a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="page-card">
            {% block content %}{% endblock %}
        </div>
    </main>
</div>
</body>
</html>
