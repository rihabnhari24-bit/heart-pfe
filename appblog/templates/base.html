<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Heart App</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        nav { margin-bottom: 20px; padding: 10px; background: #f2f2f2; }
        nav a { margin-right: 12px; text-decoration: none; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #cccccc; padding: 6px; text-align: left; }
        th { background: #f8f8f8; }
    </style>
</head>
<body>
{% if user.is_authenticated %}
<nav>
    <a href="{% url 'welcome' %}">Accueil</a>
    <a href="{% url 'account' %}">Déconnexion / mot de passe</a>
    <a href="{% url 'prediction' %}">Prédiction</a>
    <a href="{% url 'history' %}">Historique</a>
    <a href="{% url 'charts' %}">Graphes</a>
</nav>
{% endif %}

{% block content %}{% endblock %}
</body>
</html>
