{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/account.css' %}">
{% endblock %}

{% block content %}
<h2>Compte utilisateur</h2>

<form method="post" class="account-actions">
    {% csrf_token %}
    <input type="hidden" name="action" value="logout">
    <button class="btn" type="submit">Se déconnecter</button>
</form>

<h3>Changer le mot de passe</h3>
{% if error %}
<p class="info-error">{{ error }}</p>
{% endif %}
{% if success %}
<p class="info-success">{{ success }}</p>
{% endif %}

<form method="post" class="password-form">
    {% csrf_token %}
    <div class="form-grid">
        <div class="form-field">
            <label>Nouveau mot de passe</label>
            <input type="password" name="password">
        </div>
        <div class="form-field">
            <label>Répéter mot de passe</label>
            <input type="password" name="password_repeat">
        </div>
    </div>
    <br>
    <button class="btn" type="submit">Changer mot de passe</button>
</form>
{% endblock %}
